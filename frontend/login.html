<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CampusResolve</title>

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>

<body>

    <div class="auth-background"></div>

    <main class="auth-container">

        <div class="auth-card">

            <div class="college-logo" id="collegeLogo">
                CR
            </div>

            <div class="brand-name">
                CampusResolve
            </div>

            <h1>Welcome Back</h1>

            <p class="college-name" id="collegeName">
                Your College
            </p>


            <!-- ============================= -->
            <!-- LOGIN AS -->
            <!-- ============================= -->

            <div class="login-role">

                <label>
                    Login as
                </label>

                <div class="role-options">

                    <button
                        type="button"
                        class="role-btn active"
                        data-role="student"
                    >
                        🎓 Student
                    </button>

                    <button
                        type="button"
                        class="role-btn"
                        data-role="admin"
                    >
                        🛡️ Admin
                    </button>

                </div>

            </div>


            <!-- ============================= -->
            <!-- LOGIN FORM -->
            <!-- ============================= -->

            <form id="loginForm">

                <div class="input-group">

                    <label id="emailLabel">
                        Student Email ID
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your student email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-group">

                    <div class="password-label">

                        <label>
                            Password
                        </label>

                        <a href="#">
                            Forgot password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login →
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p
                class="register-text"
                id="registerText"
            >
                Don't have an account?
                <a href="register.html">
                    Create one
                </a>
            </p>


            <button
                class="change-campus"
                onclick="changeCampus()"
            >
                ← Change Campus
            </button>

        </div>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
