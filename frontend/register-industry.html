<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industry Partner Registration | CampusResolve</title>
    <link rel="stylesheet" href="css/auth.css">
    <style>
        .auth-card {
            max-width: 540px;
        }
    </style>
</head>

<body>

    <div class="auth-background"></div>

    <main class="auth-container">
        <div class="auth-card">
            <div class="college-logo" style="background:#0f766e; color:white;">
                🤝
            </div>

            <div class="brand-name">
                CampusResolve
            </div>

            <h1>Partner with Universities</h1>
            <p class="college-name" style="color: #0f766e; font-weight: 600;">
                Industry Collaboration Portal
            </p>

            <form id="industryRegisterForm">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="input-group">
                        <label>Company Name *</label>
                        <input type="text" id="companyName" placeholder="e.g. EcoTech Solutions Ltd" required>
                    </div>

                    <div class="input-group">
                        <label>Industry Category *</label>
                        <select id="industryCategory" required style="width:100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; box-sizing: border-box; background: white;">
                            <option value="Information Technology">Information Technology</option>
                            <option value="Energy & CleanTech">Energy & CleanTech</option>
                            <option value="Robotics & Automation">Robotics & Automation</option>
                            <option value="Environmental Services">Environmental Services</option>
                            <option value="Healthcare & Life Sciences">Healthcare & Life Sciences</option>
                            <option value="Smart Infrastructure">Smart Infrastructure</option>
                            <option value="Manufacturing">Manufacturing</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Areas of Technical Expertise / Core Tech (Comma separated)</label>
                    <input type="text" id="expertise" placeholder="e.g. IoT, Solar Energy, AI/ML, Smart Meters, Water Filters">
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="input-group">
                        <label>Contact Person Full Name *</label>
                        <input type="text" id="name" placeholder="e.g. Dr. Priya Sharma" required>
                    </div>

                    <div class="input-group">
                        <label>Official Work Email *</label>
                        <input type="email" id="email" placeholder="priya@ecotech.com" required>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="input-group">
                        <label>Password *</label>
                        <input type="password" id="password" placeholder="Create a strong password" required>
                    </div>

                    <div class="input-group">
                        <label>Company Website</label>
                        <input type="url" id="website" placeholder="https://ecotech.com">
                    </div>
                </div>

                <div class="input-group">
                    <label>Brief Company Overview / Capabilities (Optional)</label>
                    <textarea id="description" rows="2" placeholder="Brief summary of company domain, innovations, and collaboration interests..." style="width:100%; padding: 10px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; box-sizing: border-box;"></textarea>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn" style="background: #0f766e;">
                    Register as Industry Partner →
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <p class="register-text">
                Already registered?
                <a href="login.html" style="color: #0f766e;">Login here</a>
            </p>

            <button class="change-campus" onclick="window.location.href='index.html'">
                ← Back to Campus Home
            </button>
        </div>
    </main>

    <script src="js/register-industry.js"></script>
</body>

</html>
