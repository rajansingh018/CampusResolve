<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | CampusResolve</title>

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="auth-background"></div>


    <main class="auth-container">

        <div class="auth-card">

            <div class="college-logo" id="collegeLogo">
                CR
            </div>

            <div class="brand-name">
                CampusResolve
            </div>

            <h1>Create Account</h1>

            <p class="college-name" id="collegeName">
                Your College
            </p>


            <form id="registerForm">

                <div class="input-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>College Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="yourname@college.edu"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Student ID</label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter your student ID"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account →
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <button
                class="change-campus"
                onclick="changeCampus()"
            >
                ← Change Campus
            </button>

        </div>

    </main>


    <script src="js/register.js"></script>

</body>

</html>
